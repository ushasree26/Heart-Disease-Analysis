<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Risk Predictor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f4f6fb;
}

/* NAVBAR */

.navbar{
    background:#1f3c88;
    padding:18px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h2{
    color:white;
}

.navbar a{
    color:white;
    margin-left:25px;
    text-decoration:none;
    font-weight:500;
}

.navbar a:hover{
    border-bottom:2px solid white;
}

/* PREDICTION SECTION */

.predict-container{
    min-height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;
    background:linear-gradient(to right,#ffffff,#e8ecff);
}

.predict-box{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
    width:500px;
}

.predict-box h1{
    text-align:center;
    color:#1f3c88;
    margin-bottom:25px;
}

.predict-box input{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    border-radius:5px;
    border:1px solid #ccc;
}

.predict-box button{
    width:100%;
    padding:12px;
    background:#1f3c88;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.predict-box button:hover{
    background:#162d66;
}

/* FOOTER */

.footer{
    background:#1f3c88;
    color:white;
    text-align:center;
    padding:15px;
    font-size:14px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<h2>Heart Disease Analysis</h2>

<div>
<a href="/">Home</a>
<a href="/about">About</a>
<a href="/dashboard">Dashboard</a>
<a href="/story">Story</a>
<a href="/predict_page">Predict</a>
<a href="/contact">Contact</a>
</div>
</div>

<!-- PREDICTION FORM -->

<div class="predict-container">

<div class="predict-box">

<h1>Heart Disease Risk Predictor</h1>

<form action="/predict" method="POST">

<input type="text" name="BMI" placeholder="BMI">

<input type="text" name="Smoking" placeholder="Smoking (1 = Yes, 0 = No)">

<input type="text" name="AlcoholDrinking" placeholder="Alcohol Drinking (1/0)">

<input type="text" name="Stroke" placeholder="Stroke (1/0)">

<input type="text" name="PhysicalHealth" placeholder="Physical Health (0-30)">

<input type="text" name="MentalHealth" placeholder="Mental Health (0-30)">

<input type="text" name="DiffWalking" placeholder="Difficulty Walking (1/0)">

<input type="text" name="Sex" placeholder="Sex (1 = Male, 0 = Female)">

<input type="text" name="AgeCategory" placeholder="Age Category (Number)">

<input type="text" name="Race" placeholder="Race (Number)">

<input type="text" name="Diabetic" placeholder="Diabetic (1/0)">

<input type="text" name="PhysicalActivity" placeholder="Physical Activity (1/0)">

<input type="text" name="GenHealth" placeholder="General Health (Number)">

<input type="text" name="SleepTime" placeholder="Sleep Time">

<input type="text" name="Asthma" placeholder="Asthma (1/0)">

<input type="text" name="KidneyDisease" placeholder="Kidney Disease (1/0)">

<input type="text" name="SkinCancer" placeholder="Skin Cancer (1/0)">

<button type="submit">Predict Risk</button>

</form>

</div>

</div>

<!-- FOOTER -->

<div class="footer">
© 2026 | Heart Disease Analysis | 4-2 Data Analytics Project
</div>

</body>
</html>
